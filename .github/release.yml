# ADR-004: gh release create --generate-notes のリリースノート分類
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "✨ New Features"
      labels:
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
    - title: "🔧 Maintenance"
      labels:
        - chore
        - dependencies
